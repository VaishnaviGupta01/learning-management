services:
  postgres:
    # pgvector image so the RAG service can store embeddings in the same database later
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-lms}
      POSTGRES_USER: ${DB_USER:-lms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lms}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lms} -d ${DB_NAME:-lms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      ML_SERVICE_URL: http://ml-service:8001
      RAG_SERVICE_URL: http://rag-service:8002
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  ml-service:
    build: ./ml-service
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      BACKEND_URL: http://backend:8080
    ports:
      - "${ML_SERVICE_PORT:-8001}:8001"
    volumes:
      - ml-models:/app/models
    depends_on:
      postgres:
        condition: service_healthy

  rag-service:
    build: ./rag-service
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      BACKEND_URL: http://backend:8080
    ports:
      - "${RAG_SERVICE_PORT:-8002}:8002"
    volumes:
      - uploads:/app/uploads
      - rag-data:/app/data   # FAISS indexes + cached embedding model
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8080}
        VITE_ML_SERVICE_URL: ${VITE_ML_SERVICE_URL:-http://localhost:8001}
        VITE_RAG_SERVICE_URL: ${VITE_RAG_SERVICE_URL:-http://localhost:8002}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
      - ml-service
      - rag-service

volumes:
  pgdata:
  uploads:
  ml-models:
  rag-data:
