server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: lms-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lms}
    username: ${DB_USER:lms}
    password: ${DB_PASSWORD:lms}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:25MB}
      max-request-size: ${MAX_UPLOAD_SIZE:25MB}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-string-of-at-least-32-bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  services:
    ml-url: ${ML_SERVICE_URL:http://localhost:8001}
    rag-url: ${RAG_SERVICE_URL:http://localhost:8002}
    ml-timeout-ms: ${ML_SERVICE_TIMEOUT_MS:3000}
    rag-timeout-ms: ${RAG_SERVICE_TIMEOUT_MS:120000}   # LLM calls can take a while
  adaptive:
    window: ${ADAPTIVE_WINDOW:10}                        # last N answers per topic
    default-question-count: ${ADAPTIVE_QUESTION_COUNT:10}
  recommendations:
    top-k: ${RECOMMENDATION_TOP_K:5}
    # a prerequisite counts as complete at this mastery score (0.60 = MODERATE band)
    prerequisite-mastery: ${PREREQUISITE_MASTERY_THRESHOLD:0.6}
  upload-dir: ${UPLOAD_DIR:./uploads}

management:
  endpoints:
    web:
      exposure:
        include: health,info
